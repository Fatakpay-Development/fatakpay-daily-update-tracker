name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write Firebase env from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ] || [ -z "$FIREBASE_DATABASE_URL" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Missing Firebase secrets. Add them in the repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          {
            echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
            echo "FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN"
            echo "FIREBASE_DATABASE_URL=$FIREBASE_DATABASE_URL"
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            echo "FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET"
            echo "FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
            echo "FIREBASE_APP_ID=$FIREBASE_APP_ID"
            echo "FIREBASE_MEASUREMENT_ID=$FIREBASE_MEASUREMENT_ID"
          } > .env

      - name: Generate firebase-config.js
        run: node scripts/generate-firebase-config.js

      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html styles.css app.js data.js logo.png firebase-config.js _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
